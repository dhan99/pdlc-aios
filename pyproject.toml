[project]
name = "pdlc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dhan99", email = "dhanpalani@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pdlc = "pdlc:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "D",    # pydocstyle  -> "docstrings on public functions"
    "ANN",  # flake8-annotations -> "type hints everywhere"
    "S",    # flake8-bandit
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, and test bodies don't need docstrings.
"tests/**" = ["D", "ANN", "S101"]
# Hooks are CLI scripts: subprocess + non-zero exits are their job.
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
